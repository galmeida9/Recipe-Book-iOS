name: RecipeBook
options:
  bundleIdPrefix: com.recipebook
  deploymentTarget:
    iOS: "17.0"
packages:
  RecipeBookCore:
    path: ..
  RecipeBookUI:
    path: RecipeBookUI
settings:
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    RECIPEBOOK_APP_GROUP: group.com.recipebook.shared
    RECIPEBOOK_GOOGLE_CALLBACK_SCHEME: recipebook-unconfigured-google
    RECIPEBOOK_GOOGLE_BUNDLE_ID: "$(PRODUCT_BUNDLE_IDENTIFIER)"
targets:
  RecipeBook:
    type: application
    platform: iOS
    sources: [RecipeBook]
    dependencies:
      - package: RecipeBookCore
        product: RecipeBookCore
      - package: RecipeBookCore
        product: RecipeBookAuth
      - package: RecipeBookUI
        product: RecipeBookUI
      - package: RecipeBookUI
        product: RecipeBookPresentation
      - target: RecipeBookShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recipebook.app
        INFOPLIST_FILE: RecipeBook/Info.plist
        CODE_SIGN_ENTITLEMENTS: RecipeBook/RecipeBook.entitlements
  RecipeBookShare:
    type: app-extension
    platform: iOS
    sources: [RecipeBookShare]
    dependencies:
      - package: RecipeBookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recipebook.app.share
        INFOPLIST_FILE: RecipeBookShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: RecipeBookShare/RecipeBookShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  RecipeBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecipeBookUITests, RecipeBook/UIServiceAdapter.swift]
    dependencies:
      - target: RecipeBook
      - package: RecipeBookCore
        product: RecipeBookCore
      - package: RecipeBookCore
        product: RecipeBookAuth
      - package: RecipeBookUI
        product: RecipeBookPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recipebook.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RecipeBook
schemes:
  RecipeBook:
    build:
      targets:
        RecipeBook: all
    test:
      targets: [RecipeBookUITests]
