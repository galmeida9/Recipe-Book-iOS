name: Native source gate (manual)
on:
  push:
    branches: ['galmeida9-recipe-book-foundation']
    paths: ['ios/**', 'Package.swift', '.github/workflows/native-build.yml']
  workflow_dispatch:
    inputs:
      licensed_host_approved:
        description: 'I authorize this licensed Apple-hardware build host; unsigned build is not on-device proof'
        required: true
        type: boolean
        default: false
      upload_artifact:
        description: 'Upload unsigned app for one day (not installable/device proof)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compile:
    if: github.event_name == 'push' || inputs.licensed_host_approved
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode without downloading SDKs
        run: |
          python3 <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              developer = app + "/Contents/Developer"
              output = subprocess.check_output([developer + "/usr/bin/xcodebuild", "-version"], text=True)
              version = re.search(r"Xcode ([0-9.]+)", output).group(1)
              print(app, output.strip())
              candidates.append((tuple(map(int, version.split("."))), developer))
          if not candidates:
              raise RuntimeError("No installed Apple Xcode host toolchain is available")
          selected = max(candidates)[1]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("DEVELOPER_DIR=" + selected + "\n")
          print("Selected", selected)
          PY
      - name: Discover installed Apple tooling and runtimes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
      - name: Portable core tests
        run: swift test
      - name: Portable presentation tests
        run: swift test --package-path ios/RecipeBookUI
      - name: Build app and intact extension without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -f build/Build/Products/Debug-iphoneos/RecipeBook.app/PlugIns/RecipeBookShare.appex/RecipeBookShare
      - name: Discover an available iPhone Simulator
        id: simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Run native Simulator launch smoke test
        run: xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -destination 'id=${{ steps.simulator.outputs.id }}' -derivedDataPath simulator-build -resultBundlePath native-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export requested native fixture screenshots locally on the runner
        run: |
          xcrun xcresulttool export attachments --path native-tests.xcresult --output-path fixture-screenshots
          python3 -c 'import pathlib; files=list(pathlib.Path("fixture-screenshots").rglob("*.png")); total=sum(p.stat().st_size for p in files); print("PNG count:",len(files),"Total bytes:",total); assert len(files)>=4 and total<=10*1024*1024, "Preview screenshots missing or exceed 10 MiB bound"'
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: unsigned-native-build-not-installable
          path: build/Build/Products/Debug-iphoneos/RecipeBook.app
          retention-days: 1
