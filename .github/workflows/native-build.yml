name: Native source gate (manual)
on:
  push:
    branches: ['galmeida9-recipe-book-foundation']
    paths: ['ios/**', 'Package.swift', '.github/workflows/native-build.yml', 'scripts/native-preview-transfer*.mjs']
  workflow_dispatch:
    inputs:
      licensed_host_approved:
        description: 'I authorize this licensed Apple-hardware build host; unsigned build is not on-device proof'
        required: true
        type: boolean
        default: false
      upload_artifact:
        description: 'Upload unsigned app for one day (not installable/device proof)'
        required: true
        type: boolean
        default: false
      screenshot_logs:
        description: 'Transfer only four disclosed fixture PNGs through bounded ordinary logs; no artifacts'
        required: true
        type: boolean
        default: false
      screenshot_set:
        description: 'Known fixture selection for bounded screenshot transfer'
        required: true
        type: choice
        options: [standard, plan]
        default: standard
      installation_check_only:
        description: 'Build only a clearly labeled unsigned installation check for an existing private draft'
        required: true
        type: boolean
        default: false
      installation_check_draft_id:
        description: 'Owned existing draft release ID; only used by installation-check-only mode'
        required: false
        type: string
        default: ''
      trial_api_url:
        description: 'Configured owned HTTPS API URL for a core-trial package; empty keeps diagnostic mode'
        required: false
        type: string
        default: ''
      trial_imports_enabled:
        description: 'Enable the verified live Instagram trial; requires the actual backend/provider proof'
        required: true
        type: boolean
        default: false
      live_auth_probe:
        description: 'Only an actual iOS AppAuth inert-code transport check against the owned API; no customer credentials'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compile:
    if: github.event_name == 'push' || (inputs.licensed_host_approved && !inputs.installation_check_only && !inputs.live_auth_probe)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PREVIEW_SET: ${{ inputs.screenshot_set || 'standard' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode without downloading SDKs
        run: |
          python3 <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              developer = app + "/Contents/Developer"
              output = subprocess.check_output([developer + "/usr/bin/xcodebuild", "-version"], text=True)
              version = re.search(r"Xcode ([0-9.]+)", output).group(1)
              print(app, output.strip())
              candidates.append((tuple(map(int, version.split("."))), developer))
          if not candidates:
              raise RuntimeError("No installed Apple Xcode host toolchain is available")
          selected = max(candidates)[1]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("DEVELOPER_DIR=" + selected + "\n")
          print("Selected", selected)
          PY
      - name: Discover installed Apple tooling and runtimes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
      - name: Portable core tests
        run: swift test
      - name: Validate screenshot-only transfer integrity guards
        run: node --test scripts/native-preview-transfer.test.mjs
      - name: Portable presentation tests
        run: swift test --package-path ios/RecipeBookUI
      - name: Build app and intact extension without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -f build/Build/Products/Debug-iphoneos/RecipeBook.app/PlugIns/RecipeBookShare.appex/RecipeBookShare
      - name: Discover an available iPhone Simulator
        id: simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Run native Simulator launch smoke test
        run: |
          case "$PREVIEW_SET" in
            standard) SELECTOR="-skip-testing:RecipeBookUITests/PreviewCaptureTests/testCaptureDisclosedPlanScreen" ;;
            plan) SELECTOR="-only-testing:RecipeBookUITests/PreviewCaptureTests/testCaptureDisclosedPlanScreen" ;;
            *) exit 1 ;;
          esac
          xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -destination 'id=${{ steps.simulator.outputs.id }}' -derivedDataPath simulator-build -resultBundlePath native-tests.xcresult "$SELECTOR" -skip-testing:RecipeBookUITests/GoogleAuthTests/testLiveOwnedTokenEndpointRejectsInertCodeThroughActualAppAuthTransport CODE_SIGNING_ALLOWED=NO test
      - name: Export requested native fixture screenshots locally on the runner
        run: |
          xcrun xcresulttool export attachments --path native-tests.xcresult --output-path fixture-screenshots
          SUFFIX=""
          if [ "$PREVIEW_SET" = plan ]; then SUFFIX="-plan"; fi
          node scripts/native-preview-transfer.mjs "check$SUFFIX" fixture-screenshots
      - name: Transfer only disclosed fixture PNGs through ordinary logs
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot_logs && !inputs.upload_artifact
        run: |
          SUFFIX=""
          if [ "$PREVIEW_SET" = plan ]; then SUFFIX="-plan"; fi
          node scripts/native-preview-transfer.mjs "emit$SUFFIX" fixture-screenshots
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifact
        with:
          name: unsigned-native-build-not-installable
          path: build/Build/Products/Debug-iphoneos/RecipeBook.app
          retention-days: 1
  installation:
    if: github.event_name == 'workflow_dispatch' && inputs.licensed_host_approved && inputs.installation_check_only && inputs.installation_check_draft_id != ''
    permissions:
      contents: write
    uses: ./.github/workflows/installation-check.yml
    with:
      licensed_host_approved: ${{ inputs.licensed_host_approved }}
      draft_release_id: ${{ inputs.installation_check_draft_id }}
      package_mode: ${{ inputs.trial_api_url != '' && 'core-trial' || 'installation-check' }}
      api_url: ${{ inputs.trial_api_url }}
      imports_enabled: ${{ inputs.trial_imports_enabled }}
  live-auth-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.licensed_host_approved && inputs.live_auth_probe && !inputs.installation_check_only
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode and iPhone runtime
        run: |
          python3 <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              developer = app + "/Contents/Developer"
              version = re.search(r"Xcode ([0-9.]+)", subprocess.check_output([developer + "/usr/bin/xcodebuild", "-version"], text=True)).group(1)
              candidates.append((tuple(map(int, version.split("."))), developer))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("DEVELOPER_DIR=" + max(candidates)[1] + "\n")
          PY
      - name: Exercise actual iOS AppAuth transport against only the owned inert-code endpoint
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -destination "id=$ID" -derivedDataPath auth-transport-build -only-testing:RecipeBookUITests/GoogleAuthTests/testLiveOwnedTokenEndpointRejectsInertCodeThroughActualAppAuthTransport CODE_SIGNING_ALLOWED=NO test
