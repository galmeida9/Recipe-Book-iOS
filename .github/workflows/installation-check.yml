name: Private draft installation check
on:
  workflow_call:
    inputs:
      draft_release_id:
        description: 'Existing owned draft release ID for this exact source commit; never publish'
        required: true
        type: string
      licensed_host_approved:
        description: 'Build on the standard licensed Apple-hardware runner, no signing secrets'
        required: true
        type: boolean
        default: false
      package_mode:
        required: false
        type: string
        default: installation-check
      api_url:
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    if: inputs.licensed_host_approved
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
      PACKAGE_MODE: ${{ inputs.package_mode }}
      TRIAL_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing private draft and exact source before building
        run: |
          [[ "$DRAFT_RELEASE_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft.json
          node -e 'const r=require("./draft.json"),m=process.env.PACKAGE_MODE;if(!["installation-check","core-trial"].includes(m)||!r.draft||r.published_at||r.assets.length||r.target_commitish!==process.env.GITHUB_SHA||r.tag_name!==m+"-"+process.env.GITHUB_SHA.slice(0,12))throw Error("Draft/source/mode guard failed");if(m==="core-trial"&&process.env.TRIAL_API_URL!=="https://recipe-api-nb2yqx3agzmou.azurewebsites.net/api/")throw Error("Only the verified owned API is allowed");'
      - name: Select newest installed Xcode without downloading SDKs
        run: |
          python3 <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              developer = app + "/Contents/Developer"
              output = subprocess.check_output([developer + "/usr/bin/xcodebuild", "-version"], text=True)
              version = re.search(r"Xcode ([0-9.]+)", output).group(1)
              candidates.append((tuple(map(int, version.split("."))), developer))
          if not candidates:
              raise RuntimeError("No installed licensed Xcode")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("DEVELOPER_DIR=" + max(candidates)[1] + "\n")
          PY
      - name: Build unsigned installation diagnostic with intact extension
        run: |
          xcodebuild -version
          CHECK=YES
          if [ "$PACKAGE_MODE" = core-trial ]; then CHECK=NO; fi
          xcodebuild -project ios/RecipeBook.xcodeproj -scheme RecipeBook -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO "RECIPEBOOK_INSTALLATION_CHECK=$CHECK" "RECIPEBOOK_API_URL=$TRIAL_API_URL" build
          APP=build/Build/Products/Debug-iphoneos/RecipeBook.app
          test -f "$APP/RecipeBook"
          test -f "$APP/PlugIns/RecipeBookShare.appex/RecipeBookShare"
          test -f "$APP/Assets.car"
          test -d "$APP/RecipeBookUI_RecipeBookUI.bundle"
          test "$(plutil -extract RecipeBookInstallationCheck raw -o - "$APP/Info.plist")" = "$CHECK"
          python3 <<'PY'
          import pathlib, plistlib
          for target in ("RecipeBook", "RecipeBookShare"):
              data = plistlib.loads(pathlib.Path("ios", target, target + ".entitlements").read_bytes())
              data["com.apple.security.application-groups"] = ["group.com.recipebook.shared"]
              pathlib.Path(target + "-requested.plist").write_bytes(plistlib.dumps(data))
          PY
          # Requested metadata only. SideStore still supplies the actual team/profiles.
          codesign --force --sign - --entitlements RecipeBookShare-requested.plist "$APP/PlugIns/RecipeBookShare.appex"
          codesign --force --sign - --entitlements RecipeBook-requested.plist "$APP"
          codesign --display --entitlements - "$APP" > app-entitlements.plist
          codesign --display --entitlements - "$APP/PlugIns/RecipeBookShare.appex" > share-entitlements.plist
          python3 <<'PY'
          import plistlib, pathlib
          for name in ("app-entitlements.plist", "share-entitlements.plist"):
              value = plistlib.loads(pathlib.Path(name).read_bytes())
              assert value["com.apple.security.application-groups"] == ["group.com.recipebook.shared"]
          print("Both ad-hoc signatures retain matching requested App Group metadata; no device authorization is claimed.")
          PY
          if find "$APP" \( -name embedded.mobileprovision -o -name '*.p12' -o -name '*.p8' \) | grep -q .; then exit 1; fi
          mkdir -p installation-payload/Payload
          ditto "$APP" installation-payload/Payload/RecipeBook.app
          FILE="RecipeBook-$PACKAGE_MODE.ipa"
          (cd installation-payload && ditto -c -k --keepParent Payload "../$FILE")
          node -e 'const n=require("fs").statSync("RecipeBook-"+process.env.PACKAGE_MODE+".ipa").size;if(n<=0||n>64*1024*1024)throw Error("IPA exceeds 64 MiB bound");console.log("Unsigned IPA bytes:",n);'
          shasum -a 256 "$FILE" > "$FILE.sha256"
      - name: Upload only the bounded unsigned diagnostic to the verified draft
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft.json
          node -e 'const r=require("./draft.json");if(!r.draft||r.published_at||r.assets.length||r.target_commitish!==process.env.GITHUB_SHA)throw Error("Draft changed before upload");'
          TAG=$(node -p 'require("./draft.json").tag_name')
          FILE="RecipeBook-$PACKAGE_MODE.ipa"
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" --jq '{draft, published_at, html_url, assets: [.assets[] | {name,size,digest}]}'
